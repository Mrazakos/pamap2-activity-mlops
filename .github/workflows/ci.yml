name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write          # publish the JUnit report as a check run
  pull-requests: write   # annotate failed tests on the PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & repository hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history for the no-data scan
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff (pinned, same as requirements.txt)
        run: pip install "$(grep -E '^ruff==' requirements.txt)"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .
      - name: Notebooks have no outputs
        run: python scripts/check_notebooks.py
      - name: No data / models / credentials in any commit
        run: python scripts/check_no_data.py --history
      - name: Summary
        if: always()
        run: |
          echo "### Lint: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ruff check, ruff format, notebook-output check and full-history no-data scan" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned requirements (CPU build of the same torch version)
        run: |
          # Same pins as the cluster; only torch 2.14.1+cu126 -> 2.14.1+cpu (see docs/environment.md).
          sed -e 's/+cu126/+cpu/' -e 's#whl/cu126#whl/cpu#' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: pytest
        run: |
          python -m pytest --junitxml=junit.xml --cov=src --cov=scripts \
            --cov-report=xml --cov-report=term --cov-fail-under=80
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: junit.xml
          check_name: Test report
          include_passed: false
          detailed_summary: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Coverage summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path
          if Path("coverage.xml").exists():
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate", 0)) * 100
              print(f"### Coverage: {rate:.1f}% of lines in src/ and scripts/")
          else:
              print("### Coverage: not produced (tests did not run)")
          EOF
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: warn

  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned requirements
        run: |
          sed -e 's/+cu126/+cpu/' -e 's#whl/cu126#whl/cpu#' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict
      - name: Summary
        if: always()
        run: |
          echo "### Docs build (mkdocs --strict): ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
