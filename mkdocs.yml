site_name: PAMAP2 activity recognition (MLOps)
site_description: Reproducible activity recognition from body-worn IMUs and heart rate.
repo_url: https://github.com/Mrazakos/pamap2-activity-mlops
docs_dir: docs
strict: true
theme:
  name: readthedocs
nav:
  - Overview: index.md
  - Data: data.md
  - Experiments: experiments.md
  - Results: results.md
  - Weaknesses: weaknesses.md
  - Reproducibility: reproducibility.md
  - Environment: environment.md
  - Grading checklist: grading_checklist.md
  - Video outline: video_outline.md
  - API reference: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            members_order: source
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
